// "Invio WhatsApp": companion app of Dicio per Claude. Its accessibility service presses "Invia"
// in WhatsApp, but only right after Dicio per Claude asks for it (voice command "... e invia").
plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'org.stypox.dicio.claude.invio'
    compileSdk 35

    defaultConfig {
        applicationId 'org.stypox.dicio.claude.invio'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt((project.findProperty('vc') ?: '1').toString())
        versionName "1.${project.findProperty('vc') ?: '0'}"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
