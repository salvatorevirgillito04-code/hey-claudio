# Compila "Dicio per Claude" e la pubblica come Release di GitHub.
# Servono due secret (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEYSTORE_BASE64  la chiave di firma (file .jks) in base64
#   SIGNING_PASSWORD         la password della chiave
name: Compila Dicio per Claude

on:
  push:
    paths:
      - 'dicio-per-claude/**'
      - 'hey_claudio.tflite'
      - 'invio-whatsapp/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Controlla i secret di firma
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ] || [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Mancano i secret SIGNING_PASSWORD e/o SIGNING_KEYSTORE_BASE64 (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - name: Installa Java 17 e 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Scarica Dicio e applica le modifiche
        run: |
          git clone https://github.com/Stypox/dicio-android dicio
          cd dicio
          git checkout "$(cat ../dicio-per-claude/BASE_COMMIT)"
          git apply ../dicio-per-claude/dicio-per-claude.patch
          mkdir -p app/src/main/assets
          cp ../hey_claudio.tflite app/src/main/assets/hey_claudio.tflite
          # ogni build ha un versionCode più alto, così si installa sopra la precedente
          VC=$((100 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode = [0-9]+/versionCode = $VC/" app/build.gradle.kts
          sed -i -E "s/versionName = \"([^\"]*)\"/versionName = \"\1-claude.$GITHUB_RUN_NUMBER\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Compila l'APK
        working-directory: dicio
        run: ./gradlew assembleRelease --no-daemon -Porg.gradle.java.installations.paths="$JAVA_HOME_17_X64"

      - name: Installa Gradle per Invio WhatsApp
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compila Invio WhatsApp
        working-directory: invio-whatsapp
        run: gradle assembleRelease --no-daemon -Pvc=$((100 + GITHUB_RUN_NUMBER))

      - name: Firma l'APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/ks.jks"
          "$BT/zipalign" -f -p 4 dicio/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-key-alias claude \
            --ks-pass env:SIGNING_PASSWORD --out dicio-per-claude.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify dicio-per-claude.apk
          "$BT/zipalign" -f -p 4 invio-whatsapp/build/outputs/apk/release/invio-whatsapp-release-unsigned.apk "$RUNNER_TEMP/aligned2.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-key-alias claude \
            --ks-pass env:SIGNING_PASSWORD --out invio-whatsapp.apk "$RUNNER_TEMP/aligned2.apk"
          "$BT/apksigner" verify invio-whatsapp.apk
          rm -f "$RUNNER_TEMP/ks.jks"

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dicio-per-claude.apk invio-whatsapp.apk \
            --target "$GITHUB_SHA" \
            --title "Dicio per Claude (build ${GITHUB_RUN_NUMBER})" \
            --notes "Compilata dal branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}. Scarica dicio-per-claude.apk qui sotto e installalo sopra la versione precedente. invio-whatsapp.apk serve solo per inviare i messaggi WhatsApp da solo, va installato una volta." \
            --latest

      - name: Conserva l'APK anche come artifact
        uses: actions/upload-artifact@v5
        with:
          name: dicio-per-claude
          path: |
            dicio-per-claude.apk
            invio-whatsapp.apk
